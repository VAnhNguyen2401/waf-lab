<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Football Sport Shop</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <header>
    <h1>Football Sport Shop</h1>

    <nav>
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main>

    <section class="section">
      <h2>Search Products</h2>

      <form id="searchForm" class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search football products..."
        >

        <button type="submit">
          Search
        </button>

        <button type="button" id="resetSearch">
          Reset
        </button>
      </form>

      <p id="searchStatus"></p>
    </section>


    <section class="section">
      <h2>Products</h2>

      <div id="products"></div>
    </section>

  </main>

  <footer>
    WAF Research Lab - Football Sport Shop
  </footer>

  <script src="/js/products.js"></script>
  <script src="/js/search.js"></script>

</body>
</html>
