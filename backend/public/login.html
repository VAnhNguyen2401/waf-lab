<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <header>
    <h1>⚽ Football Sport Shop</h1>

    <nav>
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main>

    <h2>Login</h2>

    <div class="form-box">

      <form id="loginForm">

        <label for="loginUsername">
          Username
        </label>

        <br>

        <input
          type="text"
          id="loginUsername"
          placeholder="Enter username"
          required
        >

        <br><br>

        <label for="loginPassword">
          Password
        </label>

        <br>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter password"
          required
        >

        <br><br>

        <button type="submit">
          Login
        </button>

      </form>

      <p id="authMessage"></p>

      <p>
        Don't have an account?
        <a href="/register.html">Register here</a>
      </p>

    </div>

  </main>

  <footer>
    WAF Research Lab - Football Sport Shop
  </footer>

  <script src="/js/auth.js"></script>

</body>
</html>
